<!-- STITCH_THREEJS_START:ANIMATION_3 class="absolute inset-0 w-full h-full" -->
<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  <threejs-scene>
  const scene = new THREE.Scene();
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  // Simple "Paper Plane" geometry (The Dart)
  const group = new THREE.Group();
  const material = new THREE.MeshPhongMaterial({ 
    color: 0xffffff, 
    side: THREE.DoubleSide,
    flatShading: true 
  });

  const bodyGeom = new THREE.BufferGeometry();
  const vertices = new Float32Array([
    0, 0, 1.5,   // nose
    -0.5, 0, 0,  // left wing tip
    0, 0.2, 0,   // spine back
    0, 0, 1.5,   // nose
    0.5, 0, 0,   // right wing tip
    0, 0.2, 0    // spine back
  ]);
  bodyGeom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  const body = new THREE.Mesh(bodyGeom, material);
  group.add(body);
  scene.add(group);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  camera.position.z = 3;

  function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
</threejs-scene>
})();
</script>
