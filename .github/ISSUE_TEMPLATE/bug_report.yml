name: Bug report
description: Report reproducible behavior that is not working as intended.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Flight School. Do not include credentials or private information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route or screen
      placeholder: /en/plane/dart/fly/
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility settings
      description: Include reduced motion, zoom, keyboard-only use, or assistive technology when relevant.
