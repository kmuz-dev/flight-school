name: Deploy

# Only after CI has gone green on the same commit, so a red build cannot reach
# the live site. `workflow_run` fires on the default branch's completed runs;
# the conclusion check below is what makes "completed" mean "passed".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy the commit CI actually verified, not whatever main has
          # drifted to while the suite was running.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Inert until the repository carries the secret. Without this guard a
      # fork, or a repo whose owner has not connected Cloudflare, fails every
      # push with a credentials error that says nothing about what to do.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN secret; skipping deploy. Add one with Workers Scripts:Edit to ship on push."
          fi

      - name: Deploy to Cloudflare
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The deployed site, walked by the same specs CI just ran against the
      # local export. A deploy that serves a broken build should not be
      # something a person discovers.
      - name: Install Playwright browsers
        if: steps.creds.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke the live site
        if: steps.creds.outputs.present == 'true'
        run: npx playwright test tests/e2e --project=chromium --reporter=github
        env:
          E2E_BASE_URL: https://flight-school.kudakw-mutasa.workers.dev
