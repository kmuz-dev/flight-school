name: Deploy

# Only after CI has gone green on the same commit, so a red build cannot reach
# the live site. `workflow_run` fires on the default branch's completed runs;
# the conclusion check below is what makes "completed" mean "passed".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# This workflow holds the deployment credentials, so it reads and nothing more.
permissions:
  contents: read

# Vercel identifies the project by these two ids. They are identifiers rather
# than credentials - nothing can be done with them without VERCEL_TOKEN - so
# they live in the file where a reader can see which project this ships to,
# and the token alone is a secret.
env:
  VERCEL_ORG_ID: team_MrsWPit06RPujLAxxJca8Y7n
  VERCEL_PROJECT_ID: prj_wFrBpPCcjYbUIOhnF639foeFYa6s
  LIVE_URL: https://flight-school-chi.vercel.app

jobs:
  deploy:
    # `branches: [main]` above is a filter on the *head branch name* of the run
    # that triggered this one, and CI also runs on `pull_request`. A fork whose
    # own branch happens to be called `main` therefore produces a run that
    # passes that filter, and checking out its head_sha here would execute a
    # stranger's code inside a job holding the deployment token. The event and
    # repository checks are what actually pin this to our own pushes to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # One deploy at a time. Without this, two runs can be inside the deploy at
    # once and the site ends up serving whichever finished last.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy the commit CI actually verified, not whatever main has
          # drifted to while the suite was running.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Nothing here pushes; leaving a token in .git/config would only
          # widen what a compromised build script could reach.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Two things have to hold before anything reaches the live site, and this
      # is the last moment either can be judged: the repository carries a Vercel
      # token, and the commit CI verified is still the tip of main.
      #
      # The first keeps a fork, or a clone whose owner has not connected Vercel,
      # from failing every push with a credentials error that says nothing about
      # what to do. The second stops a rollback: CI runs finish in whatever
      # order they finish, so an older commit's run can land after a newer one
      # has already shipped, and without this it would happily publish itself
      # over the newer release - with the live smoke suite, running the older
      # commit's own specs, reporting success.
      - name: Decide whether to ship
        id: gate
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No VERCEL_TOKEN secret; skipping deploy. Create one at vercel.com/account/tokens and add it to ship on push."
            exit 0
          fi
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at ${tip}; ${HEAD_SHA} is stale, so this run will not deploy over a newer release."
            exit 0
          fi
          echo "ship=true" >> "$GITHUB_OUTPUT"

      # `vercel build` here rather than letting Vercel build on its side, so the
      # artefact that ships is produced from the exact commit CI verified, by
      # the same Node and the same lockfile. `--prebuilt` then uploads it
      # instead of rebuilding it.
      - name: Build for production
        if: steps.gate.outputs.ship == 'true'
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: steps.gate.outputs.ship == 'true'
        # The localized static export is more than 5,000 files. Uploading one
        # archive avoids Vercel's free-plan per-file API limit.
        run: npx vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The deployed site, walked by the same specs CI just ran against the
      # local export. A deploy that serves a broken build should not be
      # something a person discovers.
      - name: Install Playwright browsers
        if: steps.gate.outputs.ship == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke the live site
        if: steps.gate.outputs.ship == 'true'
        run: npx playwright test tests/e2e --project=chromium --reporter=github
        env:
          E2E_BASE_URL: ${{ env.LIVE_URL }}
