name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Add --strict once Phase 3 lands the eleven translated dictionaries, so
      # a locale going missing again fails the build.
      - name: i18n audit
        run: npm run i18n:audit
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E against static export
        # The github reporter annotates the failing lines in the diff; the html
        # one is what the artifact below uploads. With only the first, a failed
        # run left an empty artifact and nothing to open.
        run: npm run test:e2e -- --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
